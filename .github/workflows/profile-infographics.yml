# Раз в день перерисовывает 3D-календарь и змейку для README профиля
name: profile-infographics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile-3d-contrib/**"
      - "assets/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: 3D-календарь контрибуций
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Змейка
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/snake-light.svg?color_snake=#2d6a4f&color_dots=#ebedf0,#b7e4c7,#74c69d,#40916c,#1b4332
            assets/snake-dark.svg?palette=github-dark&color_snake=#95d5b2&color_dots=#161b22,#1b4332,#2d6a4f,#40916c,#74c69d

      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "Обновить инфографику профиля"; then
            git push
          fi
