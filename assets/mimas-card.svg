<svg xmlns="http://www.w3.org/2000/svg" width="880" height="340" viewBox="0 0 880 340" role="img" aria-labelledby="title desc">
  <title id="title">MIMAS</title>
  <desc id="desc">Голосовое AI-интервью для первичного отбора на массовые позиции в рознице</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a22"/>
      <stop offset="1" stop-color="#16402f"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2d6a4f"/>
      <stop offset="1" stop-color="#74c69d"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif; }
    .bar { fill: #52b788; transform-box: fill-box; transform-origin: center; animation: wave 1.4s ease-in-out infinite; }
    .chev { fill: none; stroke: #74c69d; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; animation: pulse 1.8s ease-in-out infinite; }
    @keyframes wave { 0%, 100% { transform: scaleY(.35); } 50% { transform: scaleY(1); } }
    @keyframes pulse { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bar, .chev { animation: none; } }
  </style>

  <rect x="1" y="1" width="878" height="338" rx="18" fill="url(#bg)" stroke="url(#edge)" stroke-width="2"/>

  <!-- Заголовок -->
  <text x="40" y="50" font-size="12" font-weight="600" letter-spacing="2" fill="#74c69d">ОТКРЫТЫЙ КОД · ПРОТОТИП</text>
  <text x="38" y="104" font-size="54" font-weight="800" letter-spacing="6" fill="#d8f3dc">MIMAS</text>
  <text x="40" y="138" font-size="20" font-weight="600" fill="#95d5b2">Голосовое AI-интервью для найма в рознице</text>
  <text x="40" y="164" font-size="14" fill="#b7e4c7" opacity=".85">кассир · продавец-консультант · сборщик заказов · кладовщик</text>

  <!-- Звуковая волна -->
  <g transform="translate(565 0)">
    <rect class="bar" x="0"   y="91" width="5" height="18" rx="2.5" style="animation-delay:-0.1s"/>
    <rect class="bar" x="10"  y="85" width="5" height="30" rx="2.5" style="animation-delay:-0.2s"/>
    <rect class="bar" x="20"  y="78" width="5" height="44" rx="2.5" style="animation-delay:-0.3s"/>
    <rect class="bar" x="30"  y="70" width="5" height="60" rx="2.5" style="animation-delay:-0.4s"/>
    <rect class="bar" x="40"  y="80" width="5" height="40" rx="2.5" style="animation-delay:-0.5s"/>
    <rect class="bar" x="50"  y="88" width="5" height="24" rx="2.5" style="animation-delay:-0.6s"/>
    <rect class="bar" x="60"  y="75" width="5" height="50" rx="2.5" style="animation-delay:-0.7s"/>
    <rect class="bar" x="70"  y="65" width="5" height="70" rx="2.5" style="animation-delay:-0.8s"/>
    <rect class="bar" x="80"  y="74" width="5" height="52" rx="2.5" style="animation-delay:-0.9s"/>
    <rect class="bar" x="90"  y="83" width="5" height="34" rx="2.5" style="animation-delay:-1.0s"/>
    <rect class="bar" x="100" y="90" width="5" height="20" rx="2.5" style="animation-delay:-1.1s"/>
    <rect class="bar" x="110" y="81" width="5" height="38" rx="2.5" style="animation-delay:-1.2s"/>
    <rect class="bar" x="120" y="71" width="5" height="58" rx="2.5" style="animation-delay:-1.3s"/>
    <rect class="bar" x="130" y="62" width="5" height="76" rx="2.5" style="animation-delay:-0.15s"/>
    <rect class="bar" x="140" y="71" width="5" height="58" rx="2.5" style="animation-delay:-0.25s"/>
    <rect class="bar" x="150" y="81" width="5" height="38" rx="2.5" style="animation-delay:-0.35s"/>
    <rect class="bar" x="160" y="90" width="5" height="20" rx="2.5" style="animation-delay:-0.45s"/>
    <rect class="bar" x="170" y="83" width="5" height="34" rx="2.5" style="animation-delay:-0.55s"/>
    <rect class="bar" x="180" y="74" width="5" height="52" rx="2.5" style="animation-delay:-0.65s"/>
    <rect class="bar" x="190" y="65" width="5" height="70" rx="2.5" style="animation-delay:-0.75s"/>
    <rect class="bar" x="200" y="75" width="5" height="50" rx="2.5" style="animation-delay:-0.85s"/>
    <rect class="bar" x="210" y="88" width="5" height="24" rx="2.5" style="animation-delay:-0.95s"/>
    <rect class="bar" x="220" y="80" width="5" height="40" rx="2.5" style="animation-delay:-1.05s"/>
    <rect class="bar" x="230" y="70" width="5" height="60" rx="2.5" style="animation-delay:-1.15s"/>
    <rect class="bar" x="240" y="78" width="5" height="44" rx="2.5" style="animation-delay:-1.25s"/>
    <rect class="bar" x="250" y="85" width="5" height="30" rx="2.5" style="animation-delay:-1.35s"/>
    <rect class="bar" x="260" y="91" width="5" height="18" rx="2.5" style="animation-delay:-0.05s"/>
    <rect class="bar" x="270" y="94" width="5" height="12" rx="2.5" style="animation-delay:-0.5s"/>
  </g>

  <line x1="40" y1="190" x2="840" y2="190" stroke="#2d6a4f" stroke-opacity=".6"/>

  <!-- Как это работает -->
  <g>
    <rect x="40" y="206" width="182" height="84" rx="12" fill="#0b2019" stroke="#2d6a4f"/>
    <circle cx="62" cy="230" r="12" fill="#2d6a4f"/>
    <text x="62" y="235" font-size="14" font-weight="700" fill="#d8f3dc" text-anchor="middle">1</text>
    <text x="82" y="235" font-size="15" font-weight="700" fill="#d8f3dc">Кандидат</text>
    <text x="56" y="260" font-size="12.5" fill="#95d5b2">отвечает голосом</text>
    <text x="56" y="277" font-size="12.5" fill="#95d5b2">за 10 минут</text>
  </g>
  <path class="chev" d="M229 241 l7 7 l-7 7" style="animation-delay:0s"/>
  <g>
    <rect x="246" y="206" width="182" height="84" rx="12" fill="#0b2019" stroke="#2d6a4f"/>
    <circle cx="268" cy="230" r="12" fill="#2d6a4f"/>
    <text x="268" y="235" font-size="14" font-weight="700" fill="#d8f3dc" text-anchor="middle">2</text>
    <text x="288" y="235" font-size="15" font-weight="700" fill="#d8f3dc">AI оценивает</text>
    <text x="262" y="260" font-size="12.5" fill="#95d5b2">по утверждённым</text>
    <text x="262" y="277" font-size="12.5" fill="#95d5b2">карточкам вопросов</text>
  </g>
  <path class="chev" d="M435 241 l7 7 l-7 7" style="animation-delay:.3s"/>
  <g>
    <rect x="452" y="206" width="182" height="84" rx="12" fill="#0b2019" stroke="#2d6a4f"/>
    <circle cx="474" cy="230" r="12" fill="#2d6a4f"/>
    <text x="474" y="235" font-size="14" font-weight="700" fill="#d8f3dc" text-anchor="middle">3</text>
    <text x="494" y="235" font-size="15" font-weight="700" fill="#d8f3dc">Отчёт</text>
    <text x="468" y="260" font-size="12.5" fill="#95d5b2">баллы и точные цитаты</text>
    <text x="468" y="277" font-size="12.5" fill="#95d5b2">из ответов</text>
  </g>
  <path class="chev" d="M641 241 l7 7 l-7 7" style="animation-delay:.6s"/>
  <g>
    <rect x="658" y="206" width="182" height="84" rx="12" fill="#0b2019" stroke="#2d6a4f"/>
    <circle cx="680" cy="230" r="12" fill="#2d6a4f"/>
    <text x="680" y="235" font-size="14" font-weight="700" fill="#d8f3dc" text-anchor="middle">4</text>
    <text x="700" y="235" font-size="15" font-weight="700" fill="#d8f3dc">Решение</text>
    <text x="674" y="260" font-size="12.5" fill="#95d5b2">о найме всегда</text>
    <text x="674" y="277" font-size="12.5" fill="#95d5b2">принимает человек</text>
  </g>

  <!-- Стек -->
  <text x="40" y="320" font-size="13" fill="#74c69d">Python · FastAPI · PostgreSQL · Next.js · React · TypeScript · Yandex AI</text>
  <text x="840" y="320" font-size="13" font-weight="600" fill="#b7e4c7" text-anchor="end">mimas.onrender.com ↗</text>
